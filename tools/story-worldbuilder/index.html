<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HammerLoom Story Worldbuilder</title>
  <style>
    :root {
      --bg: #090a0f;
      --panel: #13161f;
      --accent: #7928ca;
      --accent-bright: #00dfd8;
      --text: #f1f3f9;
      --border: #222736;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-x: hidden;
    }
    header {
      padding: 1rem 1.5rem;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 {
      margin: 0;
      font-size: 1.2rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      background: linear-gradient(90deg, var(--accent-bright), #ff0080);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .app-layout {
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 1rem;
      padding: 1rem;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }
    @media (min-width: 900px) {
      .app-layout {
        display: grid;
        grid-template-columns: 360px 1fr;
        height: calc(100vh - 70px);
      }
    }
    .control-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      overflow-y: auto;
    }
    .viewport-stage {
      background: #000;
      border: 1px solid var(--border);
      border-radius: 12px;
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 380px;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    label {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #8b949e;
    }
    textarea {
      background: #0a0c10;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.8rem;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.95rem;
      resize: vertical;
      min-height: 110px;
      outline: none;
    }
    textarea:focus { border-color: var(--accent-bright); }
    .archetypes {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.5rem;
    }
    button {
      background: #1a1e2b;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.6rem 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 600;
      transition: all 0.2s;
      text-align: left;
    }
    button:hover {
      border-color: var(--accent-bright);
      background: #252b3d;
    }
    .interpret-btn {
      background: linear-gradient(135deg, var(--accent), #ff0080);
      border: none;
      color: #fff;
      padding: 0.85rem;
      border-radius: 8px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-align: center;
      margin-top: 0.5rem;
    }
    .hud-overlay {
      position: absolute;
      bottom: 1rem;
      left: 1rem;
      right: 1rem;
      background: rgba(10, 12, 16, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 0.8rem 1.2rem;
      pointer-events: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .hud-stat {
      display: flex;
      flex-direction: column;
    }
    .hud-stat .val {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--accent-bright);
    }
    .hud-stat .lbl {
      font-size: 0.65rem;
      text-transform: uppercase;
      color: #8b949e;
    }
    .audio-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      padding: 0.75rem;
      background: #0a0c10;
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .audio-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }
    input[type="range"] {
      width: 100%;
      accent-color: var(--accent-bright);
    }
  </style>
</head>
<body>

  <header>
    <h1>HammerLoom Worldbuilder</h1>
    <span style="font-size:0.8rem; color:#8b949e;">Narrative Interpreter v1.1</span>
  </header>

  <div class="app-layout">
    <div class="control-panel">
      <div style="display:flex; flex-direction:column; gap:0.5rem;">
        <label>Plot / Story Line Input</label>
        <textarea id="storyInput" placeholder="Describe a setting, scene, or atmospheric plot point..."></textarea>
      </div>

      <button class="interpret-btn" onclick="interpretStory()">Synthesize World</button>

      <div class="audio-group">
        <label>Instinctive Audio Engine</label>
        <div class="audio-controls">
          <button id="audioToggleBtn" onclick="toggleAudio()" style="text-align:center; width:100%;">Enable Audio</button>
        </div>
        <div style="display:flex; align-items:center; gap:0.5rem; margin-top:0.25rem;">
          <span style="font-size:0.75rem; color:#8b949e;">Vol:</span>
          <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.3" oninput="updateVolume(this.value)">
        </div>
      </div>

      <div style="display:flex; flex-direction:column; gap:0.5rem;">
        <label>Quick Archetype Presets</label>
        <div class="archetypes">
          <button onclick="loadPreset('neon')">Cyber Alleys</button>
          <button onclick="loadPreset('cosmic')">Deep Void</button>
          <button onclick="loadPreset('abyssal')">Ocean Trench</button>
          <button onclick="loadPreset('ethereal')">Crystal Sanctum</button>
        </div>
      </div>

      <div style="display:flex; flex-direction:column; gap:0.5rem; margin-top:auto;">
        <label>Canvas Actions</label>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:0.5rem;">
          <button onclick="togglePause()" id="pauseBtn" style="text-align:center;">Pause</button>
          <button onclick="exportPNG()" style="text-align:center;">Export PNG</button>
        </div>
      </div>
    </div>

    <div class="viewport-stage" id="stage">
      <canvas id="worldCanvas"></canvas>
      <div class="hud-overlay">
        <div class="hud-stat">
          <span class="lbl">Active Atmosphere</span>
          <span class="val" id="hudEnv">Cyberpunk Rain</span>
        </div>
        <div class="hud-stat">
          <span class="lbl">Kinetic Tempo</span>
          <span class="val" id="hudTempo">High</span>
        </div>
        <div class="hud-stat">
          <span class="lbl">Geometry Type</span>
          <span class="val" id="hudGeo">Grid Matrix</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('worldCanvas');
    const ctx = canvas.getContext('2d');
    const stage = document.getElementById('stage');

    let isPlaying = true;
    let t = 0;
    let pointer = { x: 0, y: 0, active: false };

    let worldState = {
      mode: 'grid',
      speed: 0.02,
      density: 16,
      colorA: '#00f2fe',
      colorB: '#4facfe',
      bgA: '#030712',
      bgB: '#0a0518',
      envName: 'Cyber Alleys',
      geoName: 'Orthogonal Matrix'
    };

    const presets = {
      neon: {
        story: "Rain pouring over glowing neon grid lines in a dense, high-tech subterranean city alley.",
        state: { mode: 'grid', speed: 0.03, density: 22, colorA: '#ff007f', colorB: '#00f2fe', bgA: '#05020a', bgB: '#000814', envName: 'Cyber Alley', geoName: 'Matrix Grid' }
      },
      cosmic: {
        story: "Drifting through an immense deep space void filled with pulsating cosmic dust and ancient gravitational waves.",
        state: { mode: 'cosmic', speed: 0.008, density: 12, colorA: '#7928ca', colorB: '#ff0080', bgA: '#020108', bgB: '#080010', envName: 'Deep Space Void', geoName: 'Gravitational Oscillators' }
      },
      abyssal: {
        story: "Pressure crushing bioluminescent deep ocean currents surging past dark hydrothermal vents.",
        state: { mode: 'fluid', speed: 0.015, density: 18, colorA: '#00dfd8', colorB: '#007adf', bgA: '#010a10', bgB: '#000308', envName: 'Abyssal Trench', geoName: 'Harmonic Fluid Waves' }
      },
      ethereal: {
        story: "Sharp crystal prisms echoing resonant light energy inside a quiet, high-altitude sanctum.",
        state: { mode: 'crystalline', speed: 0.025, density: 8, colorA: '#f8acff', colorB: '#6964de', bgA: '#0b0813', bgB: '#150c21', envName: 'Crystal Sanctum', geoName: 'Refractive Vectors' }
      }
    };

    // --- INSTINCTIVE AUDIO ENGINE (Web Audio API) ---
    let audioCtx = null;
    let masterGain = null;
    let audioEnabled = false;
    let mainOsc = null;
    let filterNode = null;
    let noiseNode = null;

    function initAudio() {
      if (audioCtx) return;
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = parseFloat(document.getElementById('volumeSlider').value);
      masterGain.connect(audioCtx.destination);
      // don't start audio graph until user enables audio - setupAudioForMode will be called then
    }

    function toggleAudio() {
      if (!audioCtx) initAudio();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      audioEnabled = !audioEnabled;
      const btn = document.getElementById('audioToggleBtn');
      
      if (audioEnabled) {
        btn.innerText = "Mute Audio";
        btn.style.background = "var(--accent-bright)";
        btn.style.color = "#000";
        setupAudioForMode();
      } else {
        btn.innerText = "Enable Audio";
        btn.style.background = "#1a1e2b";
        btn.style.color = "var(--text)";
        stopAudioNodes();
      }
    }

    function updateVolume(val) {
      if (masterGain) masterGain.gain.setValueAtTime(parseFloat(val), audioCtx ? audioCtx.currentTime : 0);
    }

    function stopAudioNodes() {
      if (!audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        if (masterGain) {
          masterGain.gain.cancelScheduledValues(now);
          masterGain.gain.linearRampToValueAtTime(0.0001, now + 0.05);
        }

        if (mainOsc) {
          try { mainOsc.stop(now + 0.06); } catch(e) {}
          try { mainOsc.disconnect(); } catch(e) {}
          mainOsc = null;
        }
        if (noiseNode) {
          try { noiseNode.stop(now + 0.06); } catch(e) {}
          try { noiseNode.disconnect(); } catch(e) {}
          noiseNode = null;
        }
        if (filterNode) {
          try { filterNode.disconnect(); } catch(e) {}
          filterNode = null;
        }
      } catch (e) { /* swallow */ }
    }

    function setupAudioForMode() {
      if (!audioEnabled || !audioCtx) return;
      stopAudioNodes();

      if (worldState.mode === 'grid') {
        // Low Cyber Sub Drone
        mainOsc = audioCtx.createOscillator();
        mainOsc.type = 'sawtooth';
        mainOsc.frequency.setValueAtTime(55, audioCtx.currentTime); // A1 note
        
        filterNode = audioCtx.createBiquadFilter();
        filterNode.type = 'lowpass';
        filterNode.frequency.setValueAtTime(300, audioCtx.currentTime);

        mainOsc.connect(filterNode);
        filterNode.connect(masterGain);
        mainOsc.start();
      } else if (worldState.mode === 'cosmic') {
        // Deep Resonant Pad
        mainOsc = audioCtx.createOscillator();
        mainOsc.type = 'sine';
        mainOsc.frequency.setValueAtTime(82.41, audioCtx.currentTime); // E2 note

        filterNode = audioCtx.createBiquadFilter();
        filterNode.type = 'bandpass';
        filterNode.frequency.setValueAtTime(200, audioCtx.currentTime);

        mainOsc.connect(filterNode);
        filterNode.connect(masterGain);
        mainOsc.start();
      } else if (worldState.mode === 'fluid') {
        // Ocean Current Noise Simulation
        const bufferSize = audioCtx.sampleRate * 2;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }

        noiseNode = audioCtx.createBufferSource();
        noiseNode.buffer = buffer;
        noiseNode.loop = true;

        filterNode = audioCtx.createBiquadFilter();
        filterNode.type = 'lowpass';
        filterNode.frequency.setValueAtTime(400, audioCtx.currentTime);

        noiseNode.connect(filterNode);
        filterNode.connect(masterGain);
        noiseNode.start();
      } else {
        // Crystalline Sine Tone
        mainOsc = audioCtx.createOscillator();
        mainOsc.type = 'sine';
        mainOsc.frequency.setValueAtTime(440, audioCtx.currentTime); // A4 note

        filterNode = audioCtx.createBiquadFilter();
        filterNode.type = 'highpass';
        filterNode.frequency.setValueAtTime(800, audioCtx.currentTime);

        mainOsc.connect(filterNode);
        filterNode.connect(masterGain);
        mainOsc.start();
      }
    }

    function triggerInteractionTone() {
      if (!audioEnabled || !audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = worldState.mode === 'crystalline' ? 'triangle' : 'sine';
      
      const freq = worldState.mode === 'crystalline' ? 880 : (worldState.mode === 'grid' ? 120 : 220);
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);

      osc.connect(gain);
      gain.connect(masterGain);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.3);
    }

    document.addEventListener('visibilitychange', () => {
      if (document.hidden && audioCtx) {
        audioCtx.suspend();
      } else if (!document.hidden && audioCtx && audioEnabled) {
        audioCtx.resume();
      }
    });

    // --- CANVAS & SYSTEM LOGIC ---
    function resize() {
      const dpr = window.devicePixelRatio || 1;
      const rect = stage.getBoundingClientRect();
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
      canvas.dataset.w = rect.width;
      canvas.dataset.h = rect.height;
    }

    window.addEventListener('resize', resize);

    function interpretStory() {
      const text = document.getElementById('storyInput').value.toLowerCase();
      if (!text.trim()) return;

      if (text.includes('neon') || text.includes('tech') || text.includes('city') || text.includes('rain') || text.includes('cyber')) {
        worldState.mode = 'grid';
        worldState.colorA = '#00f2fe'; worldState.colorB = '#ff007f';
        worldState.bgA = '#030712'; worldState.bgB = '#0a0518';
        worldState.envName = 'Cyber Matrix'; worldState.geoName = 'Grid Lattice';
      } else if (text.includes('space') || text.includes('star') || text.includes('cosmic') || text.includes('void') || text.includes('dark')) {
        worldState.mode = 'cosmic';
        worldState.colorA = '#7928ca'; worldState.colorB = '#4facfe';
        worldState.bgA = '#020108'; worldState.bgB = '#080010';
        worldState.envName = 'Cosmic Void'; worldState.geoName = 'Orbit Field';
      } else if (text.includes('ocean') || text.includes('water') || text.includes('deep') || text.includes('current') || text.includes('wave')) {
        worldState.mode = 'fluid';
        worldState.colorA = '#00dfd8'; worldState.colorB = '#007adf';
        worldState.bgA = '#010a10'; worldState.bgB = '#000308';
        worldState.envName = 'Abyssal Hydro'; worldState.geoName = 'Harmonic Waves';
      } else {
        worldState.mode = 'crystalline';
        worldState.colorA = '#f8acff'; worldState.colorB = '#00f2fe';
        worldState.bgA = '#0b0813'; worldState.bgB = '#150c21';
        worldState.envName = 'Crystal Chamber'; worldState.geoName = 'Vector Prisms';
      }

      if (text.includes('fast') || text.includes('surge') || text.includes('storm') || text.includes('fight') || text.includes('crash')) {
        worldState.speed = 0.04; worldState.density = 24;
      } else if (text.includes('quiet') || text.includes('calm') || text.includes('drift') || text.includes('slow')) {
        worldState.speed = 0.008; worldState.density = 10;
      } else {
        worldState.speed = 0.02; worldState.density = 16;
      }

      updateHUD();
      setupAudioForMode();
    }

    function loadPreset(key) {
      const p = presets[key];
      document.getElementById('storyInput').value = p.story;
      worldState = { ...p.state };
      updateHUD();
      setupAudioForMode();
    }

    function updateHUD() {
      document.getElementById('hudEnv').innerText = worldState.envName;
      document.getElementById('hudGeo').innerText = worldState.geoName;
      document.getElementById('hudTempo').innerText = worldState.speed > 0.025 ? 'High / Kinetic' : (worldState.speed < 0.012 ? 'Low / Ambient' : 'Moderate');
    }

    function togglePause() {
      isPlaying = !isPlaying;
      document.getElementById('pauseBtn').innerText = isPlaying ? 'Pause' : 'Play';
      if (isPlaying) render();
    }

    function exportPNG() {
      const link = document.createElement('a');
      link.download = `worldbuilder-${worldState.envName.toLowerCase().replace(/\s+/g, '-')}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    // Pointer Events & Audio Triggers
    stage.addEventListener('pointerdown', (e) => {
      triggerInteractionTone();
    });

    stage.addEventListener('pointermove', (e) => {
      const rect = stage.getBoundingClientRect();
      pointer.x = e.clientX - rect.left;
      pointer.y = e.clientY - rect.top;
      pointer.active = true;
    });
    stage.addEventListener('pointerleave', () => pointer.active = false);

    // Renderer Loop
    function render() {
      if (!isPlaying) return;
      t += worldState.speed;

      const w = parseFloat(canvas.dataset.w || 800);
      const h = parseFloat(canvas.dataset.h || 600);

      ctx.clearRect(0, 0, w, h);

      let bg = ctx.createRadialGradient(w/2, h/2, 10, w/2, h/2, Math.max(w, h));
      bg.addColorStop(0, worldState.bgB);
      bg.addColorStop(1, worldState.bgA);
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, w, h);

      ctx.lineWidth = 1.5;
      const count = worldState.density;

      // Smoothly modulate filter frequency when audio is active (use-ramp to avoid clicks)
      if (filterNode && audioEnabled && audioCtx) {
        const now = audioCtx.currentTime;
        const mod = Math.sin(t * 2) * 50;
        if (worldState.mode === 'grid') {
          filterNode.frequency.cancelScheduledValues(now);
          filterNode.frequency.linearRampToValueAtTime(300 + mod, now + 0.05);
        }
        if (worldState.mode === 'cosmic') {
          filterNode.frequency.cancelScheduledValues(now);
          filterNode.frequency.linearRampToValueAtTime(200 + mod, now + 0.05);
        }
      }

      for (let i = 0; i < count; i++) {
        ctx.beginPath();
        let stroke = ctx.createLinearGradient(0, 0, w, h);
        stroke.addColorStop(0, worldState.colorA);
        stroke.addColorStop(1, worldState.colorB);
        ctx.strokeStyle = stroke;
        ctx.globalAlpha = 0.2 + (i / count) * 0.6;

        if (worldState.mode === 'grid') {
          let y = (h / count) * i;
          for (let x = 0; x <= w; x += 20) {
            let offset = Math.sin(x * 0.02 + t + i) * 15;
            if (x === 0) ctx.moveTo(x, y + offset);
            else ctx.lineTo(x, y + offset);
          }
        } else if (worldState.mode === 'fluid') {
          for (let x = 0; x <= w; x += 10) {
            let y = h/2 + Math.sin(x * 0.01 + t + i * 0.3) * 60 + Math.cos(x * 0.02 - t) * 30;
            if (x === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
        } else if (worldState.mode === 'cosmic') {
          let cx = w / 2, cy = h / 2;
          let radius = 20 + i * (Math.min(w, h) / (count * 2));
          let angle = t + (i * 0.2);
          ctx.arc(cx + Math.cos(angle) * 30, cy + Math.sin(angle) * 30, radius, 0, Math.PI * 2);
        } else {
          let cx = w / 2, cy = h / 2;
          let r = 40 + i * 18;
          let points = 6;
          for (let p = 0; p <= points; p++) {
            let a = (p / points) * Math.PI * 2 + t * 0.5;
            let px = cx + Math.cos(a) * (r + Math.sin(t + i) * 10);
            let py = cy + Math.sin(a) * (r + Math.cos(t + i) * 10);
            if (p === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
        }
        ctx.stroke();
      }

      ctx.globalAlpha = 1.0;
      requestAnimationFrame(render);
    }

    resize();
    loadPreset('neon');
    render();
  </script>
</body>
</html>
